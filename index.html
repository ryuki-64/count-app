<!DOCTYPE html>
<html>
    
    

    <head>
        <title>カウントアプリ</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <h2>カウントアプリ</h2>
        <input type="number" id="startNumber" placeholder="0~100で入力" oninput="checkInput()">
        <button id="setBtn" onclick="setStart()">セット</button>

        <h1 id="count">0</h1>

        <button id="plusBtn" onclick="countUp()">+1</button>
        <button id="minusBtn" onclick="countDown()">-1</button>
        <button id="plus10Btn" onclick="addTen()">+10</button>
        <button onclick="reset()">リセット</button>
        <button onclick="startAuto()">自動+</button>
        <button onclick="stopAuto()">停止</button>

        <script>

            function checkInput(){
               let input = Number(document.getElementById("startNumber").value);

               if(input < 0|| input >100){
                document.getElementById("setBtn").disabled = true;  
                } else {
                  document.getElementById("setBtn").disabled = false;  
                }

                }
 


            function setStart() {
                let input = document.getElementById("startNumber").value;
                number = Number(input);

                if(number < 0) number = 0;
                if(number > 100) number = 100;

                updateDisplay();
            }
            let number = 0;

            let timer;
            function startAuto(){
                timer = setInterval(function (){

                    if (number < 100) {
                        number++;
                        updateDisplay();
                    }
                }, 1000);
            }
            function stopAuto(){
                clearInterval(timer);
            }

            function countUp() {
                if (number < 100) {
                    number++;
                    updateDisplay();
                }
            }

            function countDown(){
                if (number > 0) {
                    number--;
                    updateDisplay();
                }
            }

            function addTen() {
                if (number + 10 <= 100) {
                    number += 10;
                } else {
                    number = 100;
                }
                updateDisplay();
            }

            function reset() {
                number = 0;
                updateDisplay();
            }

            function updateDisplay() {
                document.getElementById("count").textContent = number;

                if (number === 100) {
                    document.getElementById("plusBtn").disabled = true;
                    document.getElementById("plus10Btn").disabled = true;
                } else {
                    document.getElementById("plusBtn").disabled = false;
                    document.getElementById("plus10Btn").disabled = false;
                }

                if (number === 0) {
                  document.getElementById("minusBtn").disabled = true;  
                } else {
                  document.getElementById("minusBtn").disabled = false;  
                }

                
            }

            updateDisplay();

        </script>
    </body> 
    </html>
